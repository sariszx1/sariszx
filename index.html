<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ซาลิส 💙👑</title>
<meta name="description" content="ซาลิสตัวจริง">
<meta property="og:title" content="ซาลิส 💙👑">
<meta property="og:description" content="ซาลิสตัวจริง">
<meta property="og:image" content="https://sariszx1.github.io/profile.jpg">
<meta property="og:url" content="https://sariszx1.github.io/">
<meta property="og:type" content="website">

<style>
@keyframes backgroundMove {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
}

/* เอฟเฟกต์กรอบสายฟ้าพรีเมี่ยมเรืองแสง */
@keyframes lightningGlow {
    0% {
        border-color: #00bfff;
        box-shadow: 0 0 15px rgba(0, 191, 255, 0.6), 0 0 30px rgba(0, 120, 255, 0.4), inset 0 0 15px rgba(0, 191, 255, 0.4);
    }
    50% {
        border-color: #ffffff;
        box-shadow: 0 0 25px rgba(0, 242, 254, 1), 0 0 50px rgba(0, 140, 255, 0.8), inset 0 0 25px rgba(255, 255, 255, 0.8);
    }
    100% {
        border-color: #00bfff;
        box-shadow: 0 0 15px rgba(0, 191, 255, 0.6), 0 0 30px rgba(0, 120, 255, 0.4), inset 0 0 15px rgba(0, 191, 255, 0.4);
    }
}

/* เอฟเฟกต์แสงวิ่งวนรอบกรอบ */
@keyframes rotateLightning {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
    background:
        linear-gradient(
            rgba(0, 20, 50, 0.55),
            rgba(0, 5, 20, 0.85)
        ),
        url("background.jpg");
    background-size: 200% 200%;
    background-position: center;
    background-attachment: fixed;
    animation: backgroundMove 18s ease infinite;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 45px 20px 60px;
}

.profile {
    text-align: center;
    position: relative;
}

/* กล่องห่อรูปโปรไฟล์เพื่อให้มีวงแหวนสายฟ้าซ้อนด้านนอก */
.profile-wrapper {
    position: relative;
    width: 145px;
    height: 145px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

.profile-wrapper::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00f2fe, #4facfe, #0052D4, #439cfb, #00f2fe);
    animation: rotateLightning 4s linear infinite;
    z-index: 1;
    filter: blur(3px);
    opacity: 0.85;
}

.profile img {
    position: relative;
    width: 135px;
    height: 135px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #ffffff;
    animation: lightningGlow 2.5s infinite ease-in-out;
    z-index: 2;
}

.name {
    margin-top: 18px;
    font-size: 32px;
    font-weight: bold;
    text-shadow:
        0 2px 10px #000,
        0 0 20px rgba(0, 191, 255, 0.8);
    letter-spacing: 0.5px;
}

.description {
    margin-top: 8px;
    font-size: 17px;
    color: #e0f2fe;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.buttons {
    margin-top: 35px;
}

.button {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: white;
    background:
        linear-gradient(
            135deg,
            rgba(0, 50, 130, 0.85),
            rgba(0, 140, 255, 0.55)
        );
    border: 1px solid rgba(135, 206, 250, 0.4);
    border-radius: 20px;
    margin-bottom: 18px;
    padding: 14px 18px;
    min-height: 78px;
    box-shadow:
        0 8px 25px rgba(0, 60, 150, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
}

.button:hover {
    border-color: rgba(0, 242, 254, 0.8);
    box-shadow:
        0 10px 30px rgba(0, 150, 255, 0.6),
        inset 0 1px 3px rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
}

.button:active {
    transform: scale(0.97);
}

.button-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: rgba(0, 20, 50, 0.7);
    border: 1px solid rgba(100, 200, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-right: 16px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
}

.button-text {
    flex: 1;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

.arrow {
    font-size: 22px;
    margin-right: 4px;
    color: #00f2fe;
    text-shadow: 0 0 10px #00f2fe;
    transition: transform 0.2s ease;
}

.button:hover .arrow {
    transform: translateX(4px);
}

.footer {
    text-align: center;
    margin-top: 40px;
    color: #bae6fd;
    font-size: 13px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
</style>
</head>

<body>

<div class="container">

    <div class="profile">
        <div class="profile-wrapper">
            <img src="profile.jpg" alt="ซาลิส">
        </div>

        <div class="name">
            ซาลิส 👑🦋
        </div>

        <div class="description">
            ซาลิสตัวจริง
            <br>
            ชื่อบัญชี : ธนธัช อยู่พุ่ม 🌻
        </div>
    </div>

    <div class="buttons">
         <!-- ปุ่มที่ 1: ป้ายบัญชีซาลิส -->
        <a class="button" href="https://img2.pic.in.th/70C410CE-575B-4E58-BC26-DA1F7A389FCA.jpeg" target="_blank">
            <div class="button-icon">🍒</div>
            <div class="button-text">ป้ายบัญชีซาลิส 💙</div>
            <div class="arrow">➜</div>
        </a>

         <!-- ปุ่มที่ 2: กฎเดิมพัน -->
        <a class="button" href="https://img2.pic.in.th/A0F0A0F7-A5C0-4A67-A0F8-2F950C0592E5.png" target="_blank">
            <div class="button-icon">📜</div>
            <div class="button-text">กฎเดิมพัน</div>
            <div class="arrow">➜</div>
        </a>

         <!-- ปุ่มที่ 3: ตารางค่าธรรมเนียม -->
        <a class="button" href="ใส่ลิงก์รูปตารางค่าธรรมเนียมตรงนี้" target="_blank">
            <div class="button-icon">📊</div>
            <div class="button-text">ตารางค่าธรรมเนียม</div>
            <div class="arrow">➜</div>
        </a>

         <!-- ปุ่มที่ 4: DISCORD -->
        <a class="button" href="ใส่ลิงก์DISCORDของคุณตรงนี้" target="_blank">
            <div class="button-icon">💬</div>
            <div class="button-text">DISCORD</div>
            <div class="arrow">➜</div>
        </a>

        <!-- ปุ่มที่ 5: ช่องทางติดต่อซาลิส -->
        <a class="button" href="https://example.com" target="_blank">
            <div class="button-icon">👑</div>
            <div class="button-text">ช่องทางติดต่อซาลิส</div>
            <div class="arrow">➜</div>
        </a>
    </div>

    <div class="footer">
        © 2026 ซาลิส 👑⚡️
    </div>

</div>

</body>
</html>
