<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ซาลิส 💙👑</title>
<meta name="description" content="ซาลิสตัวจริง">
<meta property="og:title" content="ซาลิส 💙👑">
<meta property="og:description" content="ซาลิสตัวจริง">
<meta property="og:image" content="https://sariszx1.github.io/profile.jpg">
<meta property="og:url" content="https://sariszx1.github.io/">
<meta property="og:type" content="website">

<style>
@keyframes backgroundMove {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
}

@keyframes lightningBorder {
    0% {
        border-color: #00d2ff;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.8), 0 0 30px rgba(0, 150, 255, 0.6), inset 0 0 10px rgba(0, 210, 255, 0.5);
    }
    50% {
        border-color: #ffffff;
        box-shadow: 0 0 25px rgba(0, 255, 255, 1), 0 0 50px rgba(0, 120, 255, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.8);
    }
    100% {
        border-color: #00d2ff;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.8), 0 0 30px rgba(0, 150, 255, 0.6), inset 0 0 10px rgba(0, 210, 255, 0.5);
    }
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(
            rgba(0, 30, 80, 0.40),
            rgba(0, 5, 30, 0.75)
        ),
        url("background.jpg");
    background-size: 200% 200%;
    background-position: center;
    background-attachment: fixed;
    animation: backgroundMove 15s ease infinite;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 45px 20px 60px;
}

.profile {
    text-align: center;
}

.profile img {
    width: 135px;
    height: 135px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #00d2ff;
    animation: lightningBorder 2s infinite ease-in-out;
}

.name {
    margin-top: 15px;
    font-size: 32px;
    font-weight: bold;
    text-shadow:
        0 2px 8px #000,
        0 0 15px rgba(0, 170, 255, 0.8);
}

.description {
    margin-top: 8px;
    font-size: 17px;
    color: #eeeeee;
}

.buttons {
    margin-top: 35px;
}

.button {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: white;
    background:
        linear-gradient(
            90deg,
            rgba(0, 50, 130, 0.90),
            rgba(0, 140, 255, 0.65)
        );
    border: 1px solid rgba(100, 200, 255, 0.35);
    border-radius: 25px;
    margin-bottom: 18px;
    padding: 14px;
    min-height: 78px;
    box-shadow:
        0 8px 25px rgba(0, 80, 180, 0.35),
        0 0 15px rgba(0, 150, 255, 0.15);
    transition: transform 0.2s ease;
}

.button:active {
    transform: scale(0.97);
}

.button-icon {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    background: rgba(0, 20, 60, 0.75);
    border: 1px solid rgba(100, 200, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin-right: 16px;
}

.button-text {
    flex: 1;
    font-size: 18px;
    font-weight: bold;
}

.arrow {
    font-size: 25px;
    margin-right: 8px;
    color: white;
    text-shadow: 0 0 10px #00aaff;
}

.footer {
    text-align: center;
    margin-top: 35px;
    color: #9edfff;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="profile">
        <img src="profile.jpg" alt="ซาลิส">

        <div class="name">
            ซาลิส 👑🦋
        </div>

        <div class="description">
            ซาลิสตัวจริง
            <br>
            ชื่อบัญชี : ธนธัช อยู่พุ่ม 🌻
        </div>
    </div>

    <div class="buttons">
         <!-- ปุ่มที่ 1: ป้ายบัญชีซาลิส -->
        <a class="button" href="https://img2.pic.in.th/70C410CE-575B-4E58-BC26-DA1F7A389FCA.jpeg" target="_blank">
            <div class="button-icon">🍒</div>
            <div class="button-text">ป้ายบัญชีซาลิส 💙</div>
            <div class="arrow">➜</div>
        </a>

         <!-- ปุ่มที่ 2: กฎเดิมพัน -->
        <a class="button" href="https://img2.pic.in.th/A0F0A0F7-A5C0-4A67-A0F8-2F950C0592E5.png" target="_blank">
            <div class="button-icon">📜</div>
            <div class="button-text">กฎเดิมพัน</div>
            <div class="arrow">➜</div>
        </a>

         <!-- ปุ่มที่ 3: ตารางค่าธรรมเนียม -->
        <a class="button" href="ใส่ลิงก์รูปตารางค่าธรรมเนียมตรงนี้" target="_blank">
            <div class="button-icon">📊</div>
            <div class="button-text">ตารางค่าธรรมเนียม</div>
            <div class="arrow">➜</div>
        </a>

         <!-- ปุ่มที่ 4: DISCORD -->
        <a class="button" href="ใส่ลิงก์DISCORDของคุณตรงนี้" target="_blank">
            <div class="button-icon">💬</div>
            <div class="button-text">DISCORD</div>
            <div class="arrow">➜</div>
        </a>

        <!-- ปุ่มที่ 5: ช่องทางติดต่อซาลิส -->
        <a class="button" href="https://example.com" target="_blank">
            <div class="button-icon">👑</div>
            <div class="button-text">ช่องทางติดต่อซาลิส</div>
            <div class="arrow">➜</div>
        </a>
    </div>

    <div class="footer">
        © 2026 ซาลิส 👑⚡️
    </div>

</div>

</body>
</html>
